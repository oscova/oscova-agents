name: Feature request
description: Suggest a new feature or an improvement to Oscova.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea. Please search [existing issues](https://github.com/oscova/oscova-agents/issues) first, and add a 👍 reaction to a matching request instead of opening a new one.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Oscova would this change?
      options:
        - Oscova application (web interface)
        - oscova command line
        - Avatar Engine
        - Oscova.Agents framework
        - A plugin, or a new plugin
        - Documentation or website
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what makes it hard today?
      placeholder: I want to ... but currently ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like Oscova to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, screenshots or links to similar features elsewhere.
